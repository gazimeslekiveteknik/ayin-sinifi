<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayın Sınıfı - Kiosk Ekranı</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            overflow: hidden;
            cursor: none;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #0C1445 0%, #1A237E 30%, #283593 60%, #1A237E 100%);
            color: white;
            font-family: 'Segoe UI', Arial, sans-serif;
            height: 100vh;
        }
        
        .kiosk-wrapper {
            display: flex;
            height: 100vh;
            width: 100vw;
            box-sizing: border-box;
            position: relative;
        }

        /* Yükleniyor / Veri Yok tam ekran overlay */
        .kiosk-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: inherit;
            z-index: 100;
        }

        /* SOL PANEL: Şampiyonlar */
        .kiosk-sidebar {
            width: 25%;
            min-width: 300px;
            background: rgba(0,0,0,0.3);
            border-right: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
            padding: 24px;
            box-sizing: border-box;
            box-shadow: 5px 0 25px rgba(0,0,0,0.3);
        }
        .sidebar-title {
            color: #FFD700;
            font-size: 1.4rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 24px;
            text-shadow: 0 2px 10px rgba(255,215,0,0.3);
        }
        .champion-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .champion-list::-webkit-scrollbar { width: 0; } /* Scrollbar gizle */
        
        .champion-item {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .champ-month { font-size: 0.85rem; color: #B2BEC3; margin-bottom: 4px; }
        .champ-class { font-size: 1.2rem; font-weight: 700; color: white; }
        .champ-stars { font-size: 1rem; color: #FFD700; letter-spacing: 2px; }

        /* SAĞ PANEL: Ana İçerik */
        .kiosk-main {
            width: 75%;
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 32px 40px;
            box-sizing: border-box;
            position: relative;
        }
        
        .kiosk-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .school-name {
            font-size: 1.2rem;
            color: rgba(255,255,255,0.7);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .main-title {
            font-size: 2.8rem;
            font-weight: 800;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
            margin-bottom: 4px;
        }
        .month-title {
            font-size: 1.5rem;
            color: #FFD700;
            font-weight: 600;
        }

        /* GÜNCEL HAFTA (İlk 10) */
        .current-week-section {
            background: rgba(0,0,0,0.2);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid rgba(255,255,255,0.1);
            margin-bottom: 24px;
        }
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #FFD700;
            margin-bottom: 16px;
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
        }
        .top10-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px 24px;
        }
        .top10-item {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px 16px;
        }
        .rank {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; margin-right: 12px;
        }
        .rank-1 { background: #FFD700; color: #000; box-shadow: 0 0 10px rgba(255,215,0,0.5); }
        .rank-2 { background: #C0C0C0; color: #000; }
        .rank-3 { background: #CD7F32; color: #fff; }
        
        .class-name { flex: 1; font-size: 1.2rem; font-weight: 700; }
        .class-score { font-size: 1.1rem; font-weight: 600; color: #FFD700; }

        /* ÖNCEKİ HAFTALAR */
        .past-weeks-section {
            flex: 1;
            display: flex;
            gap: 16px;
            overflow: hidden;
            padding-bottom: 30px;
        }
        .past-week-card {
            flex: 1;
            background: rgba(0,0,0,0.2);
            border-radius: 12px;
            padding: 16px;
            border: 1px solid rgba(255,255,255,0.1);
            display: flex;
            flex-direction: column;
        }
        .pw-title {
            text-align: center;
            color: #B2BEC3;
            font-weight: 700;
            margin-bottom: 12px;
            font-size: 1.1rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 8px;
        }
        .pw-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px dashed rgba(255,255,255,0.05);
        }
        .pw-item:last-child { border: none; }
        .pw-rank { color: #FFD700; font-weight: bold; margin-right: 8px; }
        .pw-class { flex: 1; font-weight: 600; font-size: 1rem; }
        .pw-score { font-size: 0.9rem; opacity: 0.8; }

        .kiosk-footer {
            position: absolute;
            bottom: 16px;
            right: 40px;
            font-size: 0.9rem;
            opacity: 0.5;
        }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="kiosk-wrapper">
        <!-- SOL PANEL: ŞAMPİYONLAR -->
        <div class="kiosk-sidebar" id="sidebarSection">
            <div class="sidebar-title">📁 Geçmiş Aylar Arşivi</div>
            <div class="champion-list" id="archiveList">
                <div style="text-align:center; opacity:0.6; padding:20px;">Henüz arşivlenmiş ay yok.</div>
            </div>
            
            <div style="margin-top:auto; padding-top:20px; border-top:1px solid rgba(255,255,255,0.1);">
                <div class="sidebar-title" style="font-size:1.2rem; margin-bottom:12px;">🌟 Şampiyonlar (Yıldızlar)</div>
                <div id="kioskProgressBars" style="display:flex; flex-direction:column; gap:8px;"></div>
            </div>
        </div>

        <!-- SAĞ PANEL: ANA İÇERİK -->
        <div class="kiosk-main" id="kioskContent" class="hidden">
            <div class="kiosk-header">
                <div class="school-name" id="kioskSchoolName">Mesleki ve Teknik Anadolu Lisesi</div>
                <div class="main-title">Ayın Sınıfı Liderlik Tablosu</div>
                <div class="month-title" id="kioskMonth">-</div>
            </div>

            <!-- Güncel Hafta -->
            <div class="current-week-section">
                <div class="section-title"><i class="fas fa-calendar-week"></i> Güncel Hafta (<span id="currentWeekNum">-</span>)</div>
                <div class="top10-grid" id="currentWeekGrid">
                    <!-- JS ile dolacak -->
                </div>
            </div>

            <!-- Önceki Haftalar -->
            <div class="past-weeks-section" id="pastWeeksContainer">
                <!-- JS ile dolacak -->
            </div>

            <div class="kiosk-footer" id="kioskTime">-</div>
        </div>
        
        <!-- Yükleniyor Ekranı -->
        <div id="kioskLoading" class="kiosk-overlay">
            <div class="spinner" style="border-top-color: #FFD700; width:50px; height:50px;"></div>
            <p style="margin-top:16px; opacity:0.6;">Haftalık Sıralamalar Yükleniyor...</p>
        </div>

        <!-- Veri Yok Ekranı -->
        <div id="kioskNoData" class="kiosk-overlay hidden">
            <div class="school-name" id="kioskSchoolName2" style="font-size:1.2rem; margin-bottom:12px;">Mesleki ve Teknik Anadolu Lisesi</div>
            <div class="main-title" style="font-size:3rem; margin-bottom:20px;">Ayın Sınıfı</div>
            <div class="month-title" id="kioskMonth2" style="margin-bottom:30px;">-</div>
            <div style="text-align:center; opacity:0.7;">
                <p style="font-size:4rem; margin-bottom:16px;">📊</p>
                <p style="font-size:1.2rem;">Bu ay henüz değerlendirme yapılmamış.</p>
            </div>
            <div class="kiosk-footer" id="kioskTime2">-</div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="kiosk.js"></script>
</body>
</html>
