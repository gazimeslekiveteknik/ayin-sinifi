<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayın Sınıfı - Kiosk Ekranı</title>
    
    <!-- TV İÇİN ZORUNLU HATA YAKALAYICI (EN ÜSTTE OLMALI) -->
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            var errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:absolute; top:10%; left:5%; right:5%; background:#7f1d1d; color:#fca5a5; padding:25px; z-index:999999; border:4px solid #ef4444; border-radius:12px; font-size:22px; font-family:sans-serif; box-shadow: 0 10px 30px rgba(0,0,0,0.8);';
            errDiv.innerHTML = '<strong style="color:white; font-size:28px;">SİSTEM HATASI OLUŞTU!</strong><br><br><b>Hata:</b> ' + message + '<br><b>Satır:</b> ' + lineno + '<br><br><span style="font-size:16px;">Bu ekranı görüyorsanız TV tarayıcısı JS kodlarını okuyamıyor demektir.</span>';
            document.body.appendChild(errDiv);
            
            var overlay = document.getElementById('overlay');
            if(overlay) overlay.style.display = 'none';
            return true;
        };
    </script>

    <!-- Modern Font: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #060913; --bg-panel: rgba(17, 24, 39, 0.6); --bg-card: rgba(31, 41, 55, 0.4);
            --gold: #FBBF24; --gold-glow: rgba(251, 191, 36, 0.3); --silver: #94A3B8;
            --bronze: #B45309; --accent: #38BDF8; --text-main: #F8FAFC; --text-muted: #94A3B8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif; background-color: var(--bg-dark);
            background-image: radial-gradient(circle at 80% 0%, rgba(29, 78, 216, 0.15) 0%, transparent 50%),
                              radial-gradient(circle at 20% 100%, rgba(251, 191, 36, 0.05) 0%, transparent 50%);
            color: var(--text-main); overflow: hidden; cursor: none;
            
            /* Ekrana Tam Oturma CSS'i */
            width: 100%; height: 100%; position: absolute; top: 0; left: 0; display: flex;
        }

        .overlay {
            position: fixed; inset: 0; background: var(--bg-dark); z-index: 1000;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .overlay.hidden { display: none !important; }
        .spinner {
            width: 60px; height: 60px; border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--gold); border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .sidebar { width: 320px; background: var(--bg-panel); backdrop-filter: blur(20px); border-right: 1px solid rgba(255,255,255,0.05); display: flex; flex-direction: column; padding: 40px 30px; z-index: 10; }
        .brand-area { text-align: center; margin-bottom: 40px; }
        .app-title { font-size: 2.5rem; font-weight: 900; background: linear-gradient(135deg, #fff, #94A3B8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
        .month-badge { display: inline-block; background: rgba(56, 189, 248, 0.1); color: var(--accent); padding: 6px 16px; border-radius: 20px; font-size: 1rem; font-weight: 700; border: 1px solid rgba(56, 189, 248, 0.2); }
        .widget { margin-bottom: 40px; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .widget h3 { font-size: 1.1rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px; display: flex; align-items: center; gap: 10px; }
        .widget-list { display: flex; flex-direction: column; gap: 12px; overflow-y: auto; padding-right: 5px; }
        .star-card, .archive-card { background: var(--bg-card); border-radius: 12px; padding: 14px 16px; border: 1px solid rgba(255,255,255,0.05); }
        .star-card { display: flex; justify-content: space-between; align-items: center; }
        .sc-class { font-size: 1.1rem; font-weight: 700; } .sc-stars { color: var(--gold); }
        .archive-card { border-left: 3px solid var(--accent); padding: 12px 16px; }

        .main-content { flex: 1; padding: 40px 60px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .header-area { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 30px; }
        .header-area h2 { font-size: 2.2rem; font-weight: 800; letter-spacing: -0.5px; }
        .live-badge { display: flex; align-items: center; gap: 8px; background: rgba(239, 68, 68, 0.1); color: #EF4444; padding: 8px 16px; border-radius: 20px; font-weight: 700; border: 1px solid rgba(239, 68, 68, 0.2); }
        .pulse { width: 8px; height: 8px; background: #EF4444; border-radius: 50%; box-shadow: 0 0 10px #EF4444; animation: pulse-animation 1.5s infinite; }
        @keyframes pulse-animation { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .leaderboard { display: grid; grid-template-columns: 1fr; gap: 12px; flex: 1; align-content: flex-start; }
        .lb-row { display: flex; align-items: center; background: var(--bg-card); border-radius: 12px; padding: 12px 24px; border: 1px solid rgba(255,255,255,0.03); opacity: 0; animation: slideIn 0.5s ease forwards; }
        @keyframes slideIn { to { opacity: 1; transform: translateX(0); } }
        .lb-row.rank-1 { background: linear-gradient(90deg, rgba(251, 191, 36, 0.1) 0%, rgba(31, 41, 55, 0.4) 100%); border: 1px solid rgba(251, 191, 36, 0.3); border-left: 6px solid var(--gold); padding: 20px 24px; }
        .lb-rank { width: 40px; font-size: 1.5rem; font-weight: 900; color: var(--text-muted); text-align: center; margin-right: 20px; }
        .rank-1 .lb-rank { color: var(--gold); font-size: 2.2rem; text-shadow: 0 0 15px var(--gold-glow); }
        .lb-class { flex: 1; font-size: 1.4rem; font-weight: 700; }
        .rank-1 .lb-class { font-size: 1.8rem; color: var(--gold); }
        .lb-stats { display: flex; gap: 16px; }
        .stat-box { background: rgba(0,0,0,0.4); border-radius: 8px; padding: 8px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 100px; border: 1px solid rgba(255,255,255,0.05); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 4px; }
        .stat-val { font-size: 1.3rem; font-weight: 800; color: white; }
        .stat-box.highlight .stat-val { color: var(--accent); }
        
        .past-weeks { margin-top: 30px; padding-top: 30px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; gap: 20px; height: 140px; }
    </style>
</head>
<body>

    <div id="overlay" class="overlay">
        <div class="spinner"></div>
        <p style="margin-top:20px; font-weight:300; font-size:1.2rem; letter-spacing:2px; color:#94A3B8;">SİSTEME BAĞLANILIYOR</p>
    </div>

    <aside class="sidebar">
        <div class="brand-area">
            <div class="app-title">AYIN SINIFI</div>
            <div class="month-badge" id="kioskMonth">Yükleniyor...</div>
        </div>
        <div class="widget">
            <h3><i class="fas fa-star" style="color:var(--gold);"></i> Şampiyonlar</h3>
            <div class="widget-list" id="starsList">
                <div style="opacity:0.4; font-size:0.9rem; text-align:center; padding:10px;">Veri Bekleniyor...</div>
            </div>
        </div>
        <div class="widget">
            <h3><i class="fas fa-history"></i> Geçmiş Aylar</h3>
            <div class="widget-list" id="archiveList">
                <div style="opacity:0.4; font-size:0.9rem; text-align:center; padding:10px;">Arşiv Boş</div>
            </div>
        </div>
    </aside>

    <main class="main-content">
        <div class="header-area">
            <div>
                <h2 id="weekTitle">Haftalık Sıralama</h2>
                <p style="color:var(--text-muted); font-size:1.1rem; margin-top:4px;">Güncel anlık veriler puan tablosuna yansımaktadır.</p>
            </div>
            <div class="live-badge"><div class="pulse"></div> CANLI</div>
        </div>
        <div class="leaderboard" id="leaderboardGrid"></div>
        <div class="past-weeks" id="pastWeeksContainer" style="display: none;"></div>
    </main>

    <!-- JS ÇAĞRILARINDA CACHE KIRICI EKLENDİ (?v=2026) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js?v=2026"></script>
    <script src="kiosk.js?v=2026"></script>
    
</body>
</html>
