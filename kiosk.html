<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayın Sınıfı - Kiosk Ekranı</title>
    <!-- Modern Font: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           KİOSK MODERN TASARIM - NEO DARK THEME
           ========================================= */
        :root {
            --bg-dark: #060913;
            --bg-panel: rgba(17, 24, 39, 0.6);
            --bg-card: rgba(31, 41, 55, 0.4);
            
            --gold: #FBBF24;
            --gold-glow: rgba(251, 191, 36, 0.3);
            --silver: #94A3B8;
            --bronze: #B45309;
            --accent: #38BDF8;
            
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 80% 0%, rgba(29, 78, 216, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 20% 100%, rgba(251, 191, 36, 0.05) 0%, transparent 50%);
            color: var(--text-main);
            overflow: hidden;
            cursor: none;
            
            /* SADECE BURASI DEĞİŞTİ: Taşmayı önleyen esnek yapı */
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: flex;
        }

        /* YÜKLENİYOR / VERİ YOK OVERLAY */
        .overlay {
            position: fixed;
            inset: 0;
            background: var(--bg-dark);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
            display: none !important;
        }
        .spinner {
            width: 60px; height: 60px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: var(--gold);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* SOL PANEL */
        .sidebar {
            width: 320px;
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            border-right: 1px solid rgba(255,255,255,0.05);
            display: flex;
            flex-direction: column;
            padding: 40px 30px;
            box-shadow: 10px 0 30px rgba(0,0,0,0.5);
            z-index: 10;
        }

        .brand-area {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .app-title {
            font-size: 2.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff, #94A3B8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 4px;
        }
        .month-badge {
            display: inline-block;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 700;
            border: 1px solid rgba(56, 189, 248, 0.2);
        }

            margin-bottom: 40px;
            flex: 1;
            display: flex
